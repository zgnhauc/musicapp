<!DOCTYPE html>
{% load static %}
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Music Platform{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'musicplatform/site.css' %}">
    </head>

    <body style="text-align: center; font-family: Garamond, sans-serif; padding: 40px;">
        <nav style="background-color: hotpink; padding: 10px; text-align: center; margin-bottom: 20px;">
            <a href="/" style="color: white; margin-right: 15px; text-decoration: none;">Home</a>
            <a href="/about/" style="color: white; margin-right: 15px; text-decoration: none;">About</a>
            <a href="/songs/" style="color: white; margin-right: 15px; text-decoration: none;">Songs</a>
            {% if user.is_authenticated %}
                <span style="color: white; margin-right: 15px;">Hi, {{ user.username }}</span>
                <form method="post" action="/accounts/logout/" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" style="background: none; border: none; color: white; cursor: pointer; text-decoration: none; font-family: inherit; font-size: inherit;">Logout</button>
                </form>
            {% else %}
                <a href="/accounts/login/" style="color: white; text-decoration: none;">Login</a>
            {% endif %}
        </nav>
        
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>

        <footer style="margin-top: 40px;">
            <p>Copyright 2026 | Music Platform | IS218 | April 9, 2026</p>
        </footer>
    </body>
</html>
